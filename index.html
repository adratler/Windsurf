<title>Windsurf Ushuaia · Pronóstico de vientos y mareas</title>
<style>
  :root{
    --navy:#0a0a0a; --navy2:#1b1b1b; --orange:#f28c0f; --teal:#0d5f73; --cream:#f6d5a8; --ink:#16232d; --muted:#5d6d78;
    --line:#dfe6ea; --bg:#f3f6f8; --card:#fff; --accent:#f28c0f; --ok:#1f9d55; --warn:#d97706;
    --soft:#f7fafb; --grid:#e3e9ed; --nightband:#eef2f6; --tideline:#0d5f73; --tidept:#0b2a3f; --input:#fff;
    color-scheme: light;
  }
  body.dark{
    --ink:#e8edf0; --muted:#9aa8b1; --line:#2a333a; --bg:#0f1418; --card:#171e23; --ok:#4ade80;
    --soft:#1d252b; --grid:#28323a; --nightband:#121a1f; --tideline:#3fb4cf; --tidept:#f6d5a8; --input:#1d252b;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--navy);color:var(--cream);padding:12px 16px 14px;border-bottom:4px solid var(--orange)}
  .logo{width:52px;height:52px;border-radius:50%;flex:none}
  h1 small{display:block;font-size:12px;font-weight:500;color:#c9b597;letter-spacing:.4px}
  .wrap{max-width:960px;margin:0 auto}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.6px;flex:1;text-transform:uppercase;color:var(--cream)}
  select,input{font:inherit;border-radius:8px;border:1px solid var(--line);padding:7px 9px;background:var(--input);color:var(--ink)}
  header select{background:#ffffff10;color:var(--cream);border-color:#ffffff33}
  header select option{color:#000;background:#fff}
  button{font:inherit;cursor:pointer}
  .iconbtn{background:#ffffff10;border:1px solid #ffffff33;color:var(--cream);border-radius:8px;padding:7px 10px}
  main{padding:12px 12px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;font-weight:600}
  /* Ahora */
  .now{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
  .bigwind{display:flex;align-items:center;gap:12px}
  .bigwind .num{font-size:46px;font-weight:700;line-height:1}
  .bigwind .unit{font-size:14px;color:var(--muted)}
  .arrowbig{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none}
  .nowgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
  .stat{background:var(--bg);border-radius:10px;padding:8px 10px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:17px;font-weight:650;margin-top:2px}
  .verdict{margin-top:12px;padding:9px 12px;border-radius:10px;font-weight:600}
  /* Días */
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .day{flex:0 0 auto;min-width:112px;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--card);text-align:left;color:var(--ink)}
  .day.sel{border-color:var(--orange);box-shadow:0 0 0 2px #f28c0f40}
  .day .d{font-weight:650;text-transform:capitalize}
  .day .w{display:inline-block;margin-top:6px;padding:2px 7px;border-radius:6px;font-weight:700;font-size:14px}
  .day .h{font-size:12px;color:var(--muted);margin-top:5px}
  .day .go{font-size:12px;font-weight:650;margin-top:3px}
  /* Tabla horaria */
  .tblwrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
  table{border-collapse:collapse;font-size:13px;min-width:100%}
  th,td{padding:5px 4px;text-align:center;white-space:nowrap;border-right:1px solid var(--line)}
  th.rowh{position:sticky;left:0;background:var(--card);text-align:left;padding-left:8px;padding-right:8px;color:var(--muted);font-weight:600;z-index:1;border-right:1px solid var(--line)}
  tr.hr td{font-weight:650;background:var(--soft)}
  td.wv{font-weight:700;min-width:34px}
  td.now{outline:2px solid var(--accent);outline-offset:-2px}
  .arr{display:inline-block;width:18px;height:18px}
  .night{opacity:.55}
  /* Marea */
  #tidechart svg{width:100%;height:auto;display:block}
  .tides{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .tide{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px}
  .tide b{font-weight:700}
  .note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
  .err{background:#fff4e5;border:1px solid #f5c98a;color:#7a4a00;padding:10px 12px;border-radius:10px}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  .settings{display:none;margin-top:12px;background:#ffffff12;border-radius:10px;padding:10px;font-size:14px}
  .settings.open{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .settings label{display:flex;gap:6px;align-items:center}
  .settings input{width:64px}
  .legend{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px;font-size:11px}
  .legend span{padding:2px 6px;border-radius:4px}
  #modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-start;justify-content:center;padding:60px 12px;z-index:10}
  #modal.open{display:flex}
  #modal .box{background:var(--card);color:var(--ink);border-radius:14px;padding:16px;width:100%;max-width:480px;box-shadow:0 10px 40px #0006}
  #modal h3{margin:0 0 12px;font-size:17px}
  #sform{display:flex;gap:8px} #sform input{flex:1;min-width:0}
  .btn{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#111}
  .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .sres{margin-top:10px;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .sitem{text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:9px 11px}
  .sitem span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .vtabs{display:flex;gap:6px;margin-top:10px}
  .vtab{flex:1;max-width:170px;background:transparent;border:1px solid #ffffff33;color:var(--cream);border-radius:20px;padding:6px 10px;font-weight:600}
  .vtab.on{background:var(--orange);border-color:var(--orange);color:#0a0a0a}
  #mapview{display:flex;flex-direction:column;height:calc(100dvh - 150px);min-height:420px}
  .wmlegend{display:flex;font-size:12px;font-weight:600;color:#fff}
  .wmlegend span{flex:1;text-align:center;padding:3px 0;text-shadow:0 0 2px #0008}
  .wmlegend .u{background:#333;flex:0 0 34px}
  #wmwrap{position:relative;flex:1;min-height:0}
  #wmap{position:absolute;inset:0;background:#aac}
  #wmbg,#wmfx{position:absolute;left:0;top:0;pointer-events:none;transition:opacity .15s}
  #wmbg{opacity:0}
  #wmmsg{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:800;background:#000c;color:#fff;padding:6px 12px;border-radius:16px;font-size:13px;white-space:nowrap}
  .wmbtn{position:absolute;right:12px;bottom:34px;z-index:800;width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:#111;font-size:22px;box-shadow:0 2px 8px #0005}
  .wmbar{user-select:none;-webkit-user-select:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border-top:1px solid var(--line)}
  .wmmid{flex:1;text-align:center} #wmtime{font-weight:700;font-size:14px;text-transform:capitalize} #wmrange{width:100%}
  .leaflet-popup-content .btn{font-size:13px}
  @media (max-width:560px){
    .now{grid-template-columns:1fr}
    .bigwind .num{font-size:40px}
  }
</style>

  {id:"riogrande", name:"Río Grande (costa)", lat:-53.785, lon:-67.68, tide:true, station:"Río Grande (exterior)",

const store = {

  set(k,v){try{localStorage.setItem("vmtdf_"+k,JSON.stringify(v))}catch(e){}}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const escH = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CARD = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
const card = d => CARD[Math.round(((d%360)+360)%360/22.5)%16];
const r0 = x => x==null?"–":Math.round(x);
function windColor(kn){
  // escala tipo windguru
  const s=[[0,"#ffffff"],[5,"#e4f6fb"],[8,"#b8ecf5"],[11,"#7fe0c8"],[14,"#7ed957"],[17,"#c7e84a"],
           [20,"#f6e43a"],[23,"#f7b733"],[27,"#f27a2a"],[31,"#e8433c"],[36,"#c2257a"],[42,"#8a2bb5"]];
  let c=s[0][1]; for(const [v,col] of s){ if(kn>=v) c=col; } return c;
}
const textOn = kn => kn>=31 ? "#fff" : "#13202a";
function arrowSvg(dir,size=18,color="currentColor"){
  // dir = de dónde viene; la flecha apunta hacia donde va
  return `<svg class="arr" width="${size}" height="${size}" viewBox="0 0 24 24" style="transform:rotate(${dir+180}deg)"><path d="M12 2 L18 20 L12 16 L6 20 Z" fill="${color}"/></svg>`;
}
function nowLocal(){
  const p = new Intl.DateTimeFormat("sv-SE",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
  return p.replace(" ","T"); // "2026-11-02T09:13"
}
const fmtDay = (iso,i) => {
  if(i===0) return "Hoy"; if(i===1) return "Mañana";
  const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("es-AR",{weekday:"short",day:"numeric"});
};
const hhmm = t => t.slice(11,16);
const minsOf = t => +t.slice(11,13)*60 + +t.slice(14,16);

function tideExtrema(times,h){
  const out=[];
  for(let i=1;i<h.length-1;i++){
    const a=h[i-1],b=h[i],c=h[i+1];
    if(a==null||b==null||c==null) continue;
    const isHi = b>a && b>=c, isLo = b<a && b<=c;
    if(!isHi && !isLo) continue;
    const den=(a-2*b+c); const dt = den!==0 ? 0.5*(a-c)/den : 0;
    const val = b - 0.25*(a-c)*dt;
    const base = new Date(times[i]+":00Z").getTime() + dt*3600e3;
    const t = new Date(base).toISOString().slice(0,16);
    out.push({t, v:val, hi:isHi});
  }
  return out;
}

// ---------- datos ----------
const allSpots = () => SPOTS.concat(customSpots);
async function load(){
  const spot = allSpots().find(s=>s.id===state.spot) || SPOTS[0];
  TZ = spot.tz || TZ0;
  $("#app").innerHTML = `<div class="loading">Cargando pronóstico de ${escH(spot.name)}…</div>`;
  const w = new URL("https://api.open-meteo.com/v1/forecast");
  Object.entries({latitude:spot.lat,longitude:spot.lon,
    hourly:"wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,apparent_temperature,precipitation,cloud_cover",
    daily:"sunrise,sunset", wind_speed_unit:"kn", timezone:TZ, forecast_days:7, models:state.model
  }).forEach(([k,v])=>w.searchParams.set(k,v));
  try{
    const [wr, mr] = await Promise.all([
      fetch(w).then(r=>{ if(!r.ok) throw new Error("viento "+r.status); return r.json(); }),
      spot.harm ? Promise.resolve(predictTide(spot)) : spot.tide==="auto" ? loadTideAuto(spot) : spot.tide ? loadTide(spot) : Promise.resolve(null)
    ]);
    state.data = {spot, w:wr, m:mr, loadedAt:new Date()};
    render();
  }catch(e){
    $("#app").innerHTML = `<div class="err">No pude descargar el pronóstico (${e.message}). Revisá la conexión a internet y tocá ↻.</div>`;
  }
}

// Marea astronómica por análisis armónico (constantes de estaciones del SHN, fase de Greenwich)
function predictTide(spot){
  const rad=Math.PI/180, H=spot.harm;
  const start=Date.parse(nowLocal().slice(0,10)+"T00:00:00-03:00");
  const time=[], val=[];
  for(let k=0;k<=8*24*6;k++){ // cada 10 min, 8 días
    const ms=start+k*600e3;
    const D=(ms-Date.UTC(2000,0,1,12))/864e5, T=D/36525;
    const s=218.3165+481267.8813*T, h=280.4661+36000.7698*T, p=83.3532+4069.0137*T, N=(125.0445-1934.1363*T)*rad;
    const ut=((ms/36e5)%24+24)%24, Tg=180+15*ut;
    const fM2=1.0004-0.0373*Math.cos(N)+0.0002*Math.cos(2*N), uM2=-2.14*Math.sin(N);
    const fK1=1.0060+0.1150*Math.cos(N)-0.0088*Math.cos(2*N)+0.0006*Math.cos(3*N), uK1=-8.86*Math.sin(N)+0.68*Math.sin(2*N)-0.07*Math.sin(3*N);
    const fO1=1.0089+0.1871*Math.cos(N)-0.0147*Math.cos(2*N)+0.0014*Math.cos(3*N), uO1=10.80*Math.sin(N)-1.34*Math.sin(2*N)+0.19*Math.sin(3*N);
    const C={M2:[2*Tg-2*s+2*h,fM2,uM2], S2:[2*Tg,1,0], N2:[2*Tg-3*s+2*h+p,fM2,uM2],
             K1:[Tg+h-90,fK1,uK1], O1:[Tg-2*s+h+90,fO1,uO1]};
    let z=0; for(const c in H){ const [A,G]=H[c],[V,f,u]=C[c]; z+=f*A*Math.cos((V+u-G)*rad); }
    time.push(new Date(ms-3*36e5).toISOString().slice(0,16)); val.push(z);
  }
  return {hourly:{time, sea_level_height_msl:val}, _harm:true};
}

// Marea en cualquier lugar: busca el punto de mar más cercano con datos, en anillos alrededor del spot
async function loadTideAuto(spot){
  const rings=[0,0.12,0.3,0.6]; let allAnswered=true;
  const remember = patch => { const c=customSpots.find(x=>x.id===spot.id); if(c){ Object.assign(c,patch); store.set("custom",customSpots); } };
  for(const r of rings){
    const cands = r===0 ? [spot.tidePt || [spot.lat,spot.lon]] :
      [...Array(8)].map((_,k)=>{const a=k*Math.PI/4; return [spot.lat+r*Math.sin(a), spot.lon+r*Math.cos(a)/Math.cos(spot.lat*Math.PI/180)];});
    const res = await Promise.all(cands.map(async([lat,lon])=>{
      const u = new URL("https://marine-api.open-meteo.com/v1/marine");
      Object.entries({latitude:lat.toFixed(4),longitude:lon.toFixed(4),hourly:"sea_level_height_msl",
        timezone:TZ, forecast_days:7, cell_selection:"sea"}).forEach(([k,v])=>u.searchParams.set(k,v));
      try{ const rr=await fetch(u); if(!rr.ok){ allAnswered=false; return null; } const j=await rr.json();
        const v=j.hourly?.sea_level_height_msl||[]; if(v.filter(x=>x!=null).length<48) return null;
        const amp=Math.max(...v.filter(x=>x!=null))-Math.min(...v.filter(x=>x!=null));
        if(amp<0.05) return null; // sin marea real (lago, etc.)
        return {...j,_km:Math.round(distKm(spot.lat,spot.lon,j.latitude,j.longitude)),_pt:[lat,lon]};
      }catch(e){ allAnswered=false; return null; }
    }));
    const ok = res.filter(Boolean).sort((a,b)=>a._km-b._km);
    if(ok.length){ if(!spot.tidePt) remember({tidePt:ok[0]._pt}); return ok[0]; }
  }
  if(allAnswered) remember({tide:false}); // no hay marea: no volver a buscar
  return {_none:true};
}

// Marea: prueba varios puntos de mar cercanos hasta encontrar uno con datos
async function loadTide(spot){
  const pts = spot.tidePts || [[spot.lat,spot.lon]];
  const motivos = [];
  for(const [lat,lon] of pts){
    for(const cell of ["sea","nearest"]){
      const u = new URL("https://marine-api.open-meteo.com/v1/marine");
      Object.entries({latitude:lat,longitude:lon,hourly:"sea_level_height_msl",
        timezone:TZ, forecast_days:7, cell_selection:cell}).forEach(([k,v])=>u.searchParams.set(k,v));
      try{
        const r = await fetch(u); const j = await r.json();
        if(!r.ok || j.error){ motivos.push(j.reason || ("error "+r.status)); continue; }
        const v = j.hourly?.sea_level_height_msl || [];
        const valid = v.filter(x=>x!=null).length;
        if(valid >= 48){
          const km = Math.round(distKm(spot.lat,spot.lon,j.latitude,j.longitude));
          return {...j, _km:km};
        }
        motivos.push(`sin datos en ${lat.toFixed(2)}, ${lon.toFixed(2)}`);
      }catch(e){ motivos.push(e.message); }
    }
  }
  return {_error: [...new Set(motivos)].slice(0,3).join(" · ")};
}
function distKm(a,b,c,d){const R=6371,t=x=>x*Math.PI/180;const h=Math.sin(t(c-a)/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

// ---------- render ----------
function render(){
  const {spot,w,m} = state.data;
  const H = w.hourly, times = H.time;
  const days = w.daily.time;
  const now = nowLocal();
  const nowIdx = Math.max(0, times.findIndex(t=>t.slice(0,13)===now.slice(0,13)));
  const tideH = (m && !m._error && !m._none && m.hourly?.sea_level_height_msl) || null;
  const tideT = m?.hourly?.time || [];
  const ext = tideH ? tideExtrema(tideT,tideH) : [];
  const tideAt = t => { if(!tideH) return null; const i=tideT.indexOf(t); return i<0?null:tideH[i]; };

  const ok = kn => kn>=state.minW && kn<=state.maxW;

  // --- Ahora ---
  const ws=H.wind_speed_10m[nowIdx], gs=H.wind_gusts_10m[nowIdx], wd=H.wind_direction_10m[nowIdx];
  let tideNow="", tideTrend="";
  if(tideH){
    const a=tideAt(times[nowIdx]), b=tideAt(times[Math.min(nowIdx+1,times.length-1)]);
    if(a!=null){ tideNow = a.toFixed(1)+" m"; tideTrend = b>a ? "↑ subiendo" : "↓ bajando"; }
  }
  const nextExt = ext.filter(e=>e.t>now).slice(0,2);
  const verdict = ok(ws)
    ? {bg:"rgba(31,157,85,.15)",fg:"var(--ok)",txt:`✅ Navegable ahora: ${r0(ws)} kn del ${card(wd)}`}
    : ws>state.maxW ? {bg:"rgba(232,67,60,.15)",fg:"#e8433c",txt:`⚠️ Demasiado viento ahora (${r0(ws)} kn, ráfagas ${r0(gs)})`}
    : {bg:"var(--soft)",fg:"var(--muted)",txt:`😴 Poco viento ahora (${r0(ws)} kn). Mínimo configurado: ${state.minW} kn`};
  // próxima ventana navegable de día
  let nextWin="";
  if(!ok(ws)){
    for(let i=nowIdx+1;i<times.length;i++){
      const di = days.indexOf(times[i].slice(0,10)); if(di<0) continue;
      const sr=minsOf(w.daily.sunrise[di]), ss=minsOf(w.daily.sunset[di]), mm=minsOf(times[i]);
      if(mm>=sr && mm<=ss && ok(H.wind_speed_10m[i])){
        nextWin = `Próxima ventana: ${fmtDay(times[i].slice(0,10),di).toLowerCase()} ${hhmm(times[i])} h · ${r0(H.wind_speed_10m[i])} kn ${card(H.wind_direction_10m[i])}`; break;
      }
    }
  }

  let html = `<section class="card"><h2>Ahora · ${escH(spot.name)}</h2>
    <div class="now">
      <div class="bigwind">
        <div class="arrowbig" style="background:${windColor(ws)}">${arrowSvg(wd,30,textOn(ws))}</div>
        <div><div class="num">${r0(ws)}<span class="unit"> kn</span></div>
        <div class="unit">ráfagas ${r0(gs)} kn · ${card(wd)} (${r0(wd)}°)</div></div>
      </div>
      <div class="nowgrid">
        <div class="stat"><div class="k">Temperatura</div><div class="v">${r0(H.temperature_2m[nowIdx])}°</div></div>
        <div class="stat"><div class="k">Sensación térmica</div><div class="v">${r0(H.apparent_temperature[nowIdx])}°</div></div>
        ${tideH?`<div class="stat"><div class="k">Marea</div><div class="v">${tideNow} <span style="font-size:13px;color:var(--muted)">${tideTrend}</span></div></div>`:""}
        ${nextExt.map(e=>`<div class="stat"><div class="k">${e.hi?"Próxima pleamar":"Próxima bajamar"}</div><div class="v">${hhmm(e.t)} h · ${e.v.toFixed(1)} m</div></div>`).join("")}
      </div>
    </div>
    <div class="verdict" style="background:${verdict.bg};color:${verdict.fg}">${verdict.txt}${nextWin?`<div style="font-weight:500;margin-top:3px">${nextWin}</div>`:""}</div>
  </section>`;

  html += "%%TIDE%%";
  // --- Días ---
  html += `<section class="card"><h2>Próximos días (horas de luz)</h2><div class="days">`;
  days.forEach((d,di)=>{
    const sr=minsOf(w.daily.sunrise[di]), ss=minsOf(w.daily.sunset[di]);
    let mx=0, mxd=0, good=0;
    times.forEach((t,i)=>{ if(t.slice(0,10)!==d) return; const mm=minsOf(t); if(mm<sr||mm>ss) return;
      const v=H.wind_speed_10m[i]; if(v>mx){mx=v;mxd=H.wind_direction_10m[i];} if(ok(v)) good++; });
    const dExt = ext.filter(e=>e.t.slice(0,10)===d);
    html += `<button class="day ${di===state.day?"sel":""}" data-day="${di}">
      <div class="d">${fmtDay(d,di)}</div>
      <div class="w" style="background:${windColor(mx)};color:${textOn(mx)}">${r0(mx)} kn ${card(mxd)}</div>
      <div class="go" style="color:${good?"var(--ok)":"var(--muted)"}">${good?`${good} h navegables`:"sin ventana"}</div>
      ${dExt.length?`<div class="h">${dExt.filter(e=>e.hi).map(e=>"▲"+hhmm(e.t)).join(" ")}</div>`:""}
    </button>`;
  });
  html += `</div></section>`;

  // --- Tabla horaria del día elegido ---
  const dSel = days[state.day];
  const sr=minsOf(w.daily.sunrise[state.day]), ss=minsOf(w.daily.sunset[state.day]);
  const idx = times.map((t,i)=>i).filter(i=>times[i].slice(0,10)===dSel && +times[i].slice(11,13)>=5 && +times[i].slice(11,13)<=23);
  const isNight = i => { const mm=minsOf(times[i]); return mm<sr-30||mm>ss+30; };
  const cls = i => (isNight(i)?"night ":"")+(i===nowIdx?"now":"");
  const row = (label, f, extra="") => `<tr ${extra}><th class="rowh">${label}</th>${idx.map(i=>f(i)).join("")}</tr>`;
  html += `<section class="card"><h2>${fmtDay(dSel,state.day)} · hora por hora</h2><div class="tblwrap"><table>
    ${row("Hora", i=>`<td class="${cls(i)}">${times[i].slice(11,13)}</td>`, 'class="hr"')}
    ${row("Viento kn", i=>{const v=H.wind_speed_10m[i]; return `<td class="wv ${cls(i)}" style="background:${windColor(v)};color:${textOn(v)}">${r0(v)}</td>`})}
    ${row("Ráfagas kn", i=>{const v=H.wind_gusts_10m[i]; return `<td class="wv ${cls(i)}" style="background:${windColor(v)};color:${textOn(v)}">${r0(v)}</td>`})}
    ${row("Dirección", i=>`<td class="${cls(i)}">${arrowSvg(H.wind_direction_10m[i])}<div style="font-size:11px">${card(H.wind_direction_10m[i])}</div></td>`)}
    ${row("Temp °C", i=>`<td class="${cls(i)}">${r0(H.temperature_2m[i])}</td>`)}
    ${row("Sensación", i=>`<td class="${cls(i)}">${r0(H.apparent_temperature[i])}</td>`)}
    ${row("Lluvia mm", i=>{const p=H.precipitation[i]; return `<td class="${cls(i)}" style="color:${p>0?"#3b8fd9":"var(--muted)"}">${p>0?p.toFixed(1):"·"}</td>`})}
    ${tideH?row("Marea m", i=>{const v=tideAt(times[i]); return `<td class="${cls(i)}">${v==null?"–":v.toFixed(1)}</td>`}):""}
  </table></div>
  <div class="legend">${[0,5,8,11,14,17,20,23,27,31,36,42].map(k=>`<span style="background:${windColor(k)};color:${textOn(k)}">${k}+</span>`).join("")}</div>
  <div class="note">☀️ Sale ${hhmm(w.daily.sunrise[state.day])} · se pone ${hhmm(w.daily.sunset[state.day])} h. Las horas de noche se ven más claras.</div>
  </section>`;

  // --- Marea ---
  let tideHtml="";
  if(spot.tide){
    if(tideH){
      tideHtml += `<section class="card"><h2>Marea · ${fmtDay(dSel,state.day)}</h2><div id="tidechart"></div>
        <div class="tides">${ext.filter(e=>e.t.slice(0,10)===dSel).map(e=>`<div class="tide">${e.hi?"▲ Pleamar":"▼ Bajamar"} <b>${hhmm(e.t)}</b> · ${e.v.toFixed(1)} m</div>`).join("")||"<span class='note'>Sin extremos este día</span>"}</div>
        <div class="note">${m._harm?`Marea astronómica calculada con las constantes armónicas de la estación ${spot.station} del SHN. Alturas respecto del nivel medio (las tablas del SHN suman un valor fijo, por eso sus números son mayores); los horarios y la diferencia entre pleamar y bajamar son los que importan. No incluye el efecto del viento ni de la presión.`:""}${m._km>3?`Calculada en el punto de mar más cercano con datos, a ${m._km} km del spot. `:""}${m._harm?"":"Alturas respecto del nivel medio del mar, calculadas por modelo (Open-Meteo). Comparalo con la tabla oficial del puerto antes de confiar: cerca de la costa la altura puede diferir."}</div></section>`;
    } else if(m && m._none){
      tideHtml += `<section class="card"><h2>Marea</h2><div class="note" style="margin:0">No hay datos de marea para este lugar (no hay mar cerca, o es un lago o río). Se muestra solo el viento.</div></section>`;
    } else {
      tideHtml += `<section class="card"><div class="err">No pude cargar la marea para este spot.<div style="font-size:12px;margin-top:4px">Motivo: ${(m&&m._error)||"sin respuesta del servicio"}</div></div></section>`;
    }
  }

  html = html.replace("%%TIDE%%", tideHtml);
  html += `<div class="note" style="text-align:center">Datos: Open-Meteo · actualizado ${state.data.loadedAt.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}</div>`;
  $("#app").innerHTML = html;
  document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;render();});
  if(tideH) drawTide(tideT,tideH,ext,dSel,now,w.daily.sunrise[state.day],w.daily.sunset[state.day]);
}

function drawTide(T,Hh,ext,day,now,sunrise,sunset){
  const pts=[]; T.forEach((t,i)=>{ if(t.slice(0,10)===day && Hh[i]!=null) pts.push([minsOf(t)/60,Hh[i]]); });
  // agregar 00h del día siguiente para cerrar la curva
  const nx = T.findIndex(t=>t.slice(0,10)>day); if(nx>=0 && Hh[nx]!=null) pts.push([24,Hh[nx]]);
  if(pts.length<2) return;
  const box=document.getElementById("tidechart");
  const W=Math.max(320,box.clientWidth||900),Hc=W<600?200:220,pl=40,pr=12,pt=22,pb=28;
  let lo=Math.min(...pts.map(p=>p[1])), hi=Math.max(...pts.map(p=>p[1])); const pad=(hi-lo)*0.15||0.2; lo-=pad; hi+=pad;
  const X=h=>pl+(W-pl-pr)*h/24, Y=v=>pt+(Hc-pt-pb)*(1-(v-lo)/(hi-lo));
  let path=`M${X(pts[0][0])},${Y(pts[0][1])}`;
  const P=pts.map(([h,v])=>[X(h),Y(v)]);
  for(let i=0;i<P.length-1;i++){ // Catmull-Rom suave
    const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    path+=` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`; }
  const area = path+` L${X(pts.at(-1)[0])},${Hc-pb} L${X(pts[0][0])},${Hc-pb} Z`;
  const srH=minsOf(sunrise)/60, ssH=minsOf(sunset)/60;
  let s=`<svg viewBox="0 0 ${W} ${Hc}" role="img" aria-label="Curva de marea">
    <rect x="${X(0)}" y="${pt}" width="${X(srH)-X(0)}" height="${Hc-pt-pb}" fill="var(--nightband)"/>
    <rect x="${X(ssH)}" y="${pt}" width="${X(24)-X(ssH)}" height="${Hc-pt-pb}" fill="var(--nightband)"/>`;
  for(let h=0;h<=24;h+=(W<600?6:3)) s+=`<line x1="${X(h)}" x2="${X(h)}" y1="${pt}" y2="${Hc-pb}" stroke="var(--grid)"/><text x="${X(h)}" y="${Hc-9}" font-size="12" fill="var(--muted)" text-anchor="middle">${String(h).padStart(2,"0")}h</text>`;
  const step = (hi-lo)>6?2:(hi-lo)>3?1:0.5;
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${Y(v)+4}" font-size="12" fill="var(--muted)" text-anchor="end">${v.toFixed(step<1?1:0)}m</text>`;
  s+=`<path d="${area}" fill="var(--tideline)" fill-opacity=".18"/><path d="${path}" fill="none" stroke="var(--tideline)" stroke-width="2.5"/>`;
  ext.filter(e=>e.t.slice(0,10)===day).forEach(e=>{ const x=X(minsOf(e.t)/60), y=Y(e.v);
    s+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--tidept)"/><text x="${x}" y="${e.hi?y-9:y+18}" font-size="12.5" font-weight="700" fill="var(--tidept)" text-anchor="${x>W-70?"end":x<pl+40?"start":"middle"}">${hhmm(e.t)} · ${e.v.toFixed(1)}m</text>`; });
  if(now.slice(0,10)===day){ const x=X(minsOf(now)/60); s+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${Hc-pb}" stroke="#e8433c" stroke-width="2" stroke-dasharray="4 3"/><text x="${x+4}" y="${Hc-pb-6}" font-size="12" font-weight="600" fill="#e8433c">ahora</text>`; }
  s+=`</svg>`;
  box.innerHTML=s;
}

const LEAFLET_JS="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
const LEAFLET_CSS="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
const WM = {map:null, tiles:null, grid:null, t:0, anim:null, parts:[], samp:null, markers:null, fetching:false};
function setView(v){
  state.view=v;
  document.querySelectorAll(".vtab").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#app").style.display = v==="map"?"none":"";
  $("#mapview").style.display = v==="map"?"":"none";
  if(v==="map"){ fitMapHeight(); openMap(); } else stopAnim();
}
document.querySelectorAll(".vtab").forEach(b=>b.onclick=()=>setView(b.dataset.v));
function fitMapHeight(){ const h=window.innerHeight-document.querySelector("header").offsetHeight; $("#mapview").style.height=Math.max(380,h)+"px"; }
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  return new Promise((ok,ko)=>{
    const c=document.createElement("link"); c.rel="stylesheet"; c.href=LEAFLET_CSS; document.head.appendChild(c);
    const s=document.createElement("script"); s.src=LEAFLET_JS; s.onload=ok; s.onerror=()=>ko(new Error("sin conexión")); document.head.appendChild(s);
  });
}
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
function tileUrl(){ return ESRI+(state.theme==="dark"?"World_Dark_Gray_Base":"World_Light_Gray_Base")+"/MapServer/tile/{z}/{y}/{x}"; }
function labelUrl(){ return ESRI+(state.theme==="dark"?"World_Dark_Gray_Reference":"World_Light_Gray_Reference")+"/MapServer/tile/{z}/{y}/{x}"; }
function wmMsg(t){ const e=$("#wmmsg"); e.textContent=t||""; e.style.display=t?"":"none"; }
async function openMap(){
  try{ await loadLeaflet(); }catch(e){ wmMsg("No se pudo cargar el mapa: hace falta conexión a internet."); return; }
  const spot = allSpots().find(s=>s.id===state.spot)||SPOTS[0];
  if(!WM.map){
    WM.map = L.map("wmap",{zoomControl:false, worldCopyJump:true, minZoom:2}).setView([spot.lat,spot.lon], 9);
    WM.tiles = L.tileLayer(tileUrl(),{maxZoom:18,maxNativeZoom:16,attribution:'© Esri · © OpenStreetMap · Open-Meteo'}).addTo(WM.map);
    const wp=WM.map.createPane("wind"); wp.style.zIndex=450; wp.style.pointerEvents="none";
    wp.appendChild($("#wmbg")); wp.appendChild($("#wmfx"));
    const lp=WM.map.createPane("labels"); lp.style.zIndex=550; lp.style.pointerEvents="none";
    WM.labels = L.tileLayer(labelUrl(),{pane:"labels",maxZoom:18,maxNativeZoom:16}).addTo(WM.map);
    WM.map.createPane("spots").style.zIndex=650;
    WM.markers = L.layerGroup().addTo(WM.map);
    WM.map.on("movestart zoomstart", ()=>{ stopAnim(); $("#wmbg").style.opacity=0; $("#wmfx").style.opacity=0; });
    WM.map.on("moveend", ()=>{ clearTimeout(WM.deb); WM.deb=setTimeout(refreshMap,350); });
    WM.map.on("click", e=>{
      const w = WM.grid && sampleAt(e.latlng.lat, e.latlng.lng);
      const lat=e.latlng.lat, lon=((e.latlng.lng+540)%360)-180;
      const txt = w ? `<b>${Math.round(w.s)} kn</b> del ${card(w.d)}` : "Sin datos de viento acá";
      L.popup().setLatLng(e.latlng).setContent(`<div style="font-size:14px">${txt}<br><span style="color:#5d6d78;font-size:12px">${lat.toFixed(2)}, ${lon.toFixed(2)}</span><br><button class="btn pri" style="margin-top:6px" id="pp_go">Ver pronóstico acá</button></div>`).openOn(WM.map);
      setTimeout(()=>{ const b=$("#pp_go"); if(b) b.onclick=()=>{ WM.map.closePopup();
        addSpot({id:"c_pt_"+lat.toFixed(2)+"_"+lon.toFixed(2), name:`Punto ${lat.toFixed(2)}, ${lon.toFixed(2)}`, lat, lon, tz:TZ, tide:"auto"}); setView("fc"); }; },0);
    });
    $("#wmprev").onclick=()=>setHour(WM.t-3);
    $("#wmnext").onclick=()=>setHour(WM.t+3);
    $("#wmrange").oninput=e=>setHour(+e.target.value);
    $("#wmloc").onclick=()=>{ if(!navigator.geolocation) return; navigator.geolocation.getCurrentPosition(p=>WM.map.setView([p.coords.latitude,p.coords.longitude],10),()=>wmMsg("No se pudo obtener tu ubicación."),{timeout:15000}); };
    window.addEventListener("resize",()=>{ if(state.view==="map"){ fitMapHeight(); WM.map.invalidateSize(); refreshMap(); } });
  } else {
    WM.map.invalidateSize();
  }
  drawSpotMarkers();
  setTimeout(()=>{ WM.map.invalidateSize(); refreshMap(true); },50);
}
function drawSpotMarkers(){
  if(!WM.markers) return; WM.markers.clearLayers();
  allSpots().forEach(s=>{
    const m=L.circleMarker([s.lat,s.lon],{pane:"spots",radius:7,color:"#0a0a0a",weight:2,fillColor:"#f28c0f",fillOpacity:1}).addTo(WM.markers);
    m.bindPopup(`<b>${escH(s.name)}</b><br><button class="btn pri" style="margin-top:6px" data-go="${s.id}">Ver pronóstico</button>`);
    m.on("popupopen",()=>{ const b=document.querySelector(`[data-go="${s.id}"]`); if(b) b.onclick=()=>{ WM.map.closePopup(); selectSpot(s.id); setView("fc"); }; });
  });
}
// ---- datos de viento en grilla ----
async function refreshMap(force){
  if(!WM.map || state.view!=="map") return;
  const b = WM.map.getBounds(), z = WM.map.getZoom();
  const g = WM.grid;
  const inside = g && !force && g.z===z && b.getSouth()>=g.lat0 && b.getNorth()<=g.lat1 && b.getWest()>=g.lon0 && b.getEast()<=g.lon1 && g.model===state.model;
  if(!inside){ await fetchGrid(b.pad(0.25), z); }
  if(WM.grid){ setHour(WM.t, true); }
}
async function fetchGrid(b, z){
  const size=WM.map.getSize();
  let lat0=Math.max(-80,b.getSouth()), lat1=Math.min(80,b.getNorth()), lon0=b.getWest(), lon1=b.getEast();
  if(lon1-lon0>360){ lon0=-180; lon1=180; }
  const nx = 9, ny = Math.max(7, Math.min(15, Math.round(nx*size.y/size.x)));
  const lats=[], lons=[];
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    lats.push((lat0+(lat1-lat0)*j/(ny-1)).toFixed(3));
    lons.push(((((lon0+(lon1-lon0)*i/(nx-1))+540)%360)-180).toFixed(3));
  }
  const u=new URL("https://api.open-meteo.com/v1/forecast");
  Object.entries({latitude:lats.join(","),longitude:lons.join(","),hourly:"wind_speed_10m,wind_direction_10m",
    wind_speed_unit:"kn",forecast_days:4,timezone:TZ,models:state.model}).forEach(([k,v])=>u.searchParams.set(k,v));
  wmMsg("Cargando viento…");
  try{
    const r=await fetch(u); const j=await r.json();
    if(!r.ok||j.error) throw new Error(j.reason||("error "+r.status));
    const arr = Array.isArray(j)?j:[j];
    const times = arr[0].hourly.time;
    const S=[], D=[];
    arr.forEach(p=>{ S.push(p.hourly.wind_speed_10m); D.push(p.hourly.wind_direction_10m); });
    const keep = WM.grid && WM.grid.times[WM.t];
    WM.grid={lat0,lat1,lon0,lon1,nx,ny,S,D,times,z,model:state.model};
    let t = keep ? times.indexOf(keep) : -1;
    if(t<0){ const now=nowLocal().slice(0,13); t=Math.max(0,times.findIndex(x=>x.slice(0,13)===now)); }
    WM.t=t; $("#wmrange").max=times.length-1;
    wmMsg("");
  }catch(e){ wmMsg("No pude cargar el viento del mapa ("+e.message+")."); }
}
function sampleAt(lat, lon){
  const g=WM.grid; if(!g) return null;
  while(lon<g.lon0) lon+=360; while(lon>g.lon1+1e-9 && lon-360>=g.lon0) lon-=360;
  const fx=(lon-g.lon0)/(g.lon1-g.lon0)*(g.nx-1), fy=(lat-g.lat0)/(g.lat1-g.lat0)*(g.ny-1);
  if(fx<0||fy<0||fx>g.nx-1||fy>g.ny-1) return null;
  const i=Math.min(g.nx-2,Math.floor(fx)), j=Math.min(g.ny-2,Math.floor(fy)), a=fx-i, c=fy-j, t=WM.t;
  let U=0,V=0,W=0;
  [[i,j,(1-a)*(1-c)],[i+1,j,a*(1-c)],[i,j+1,(1-a)*c],[i+1,j+1,a*c]].forEach(([x,y,w])=>{
    const k=y*g.nx+x, s=g.S[k][t], d=g.D[k][t]; if(s==null||d==null) return;
    U+=w*(-s*Math.sin(d*Math.PI/180)); V+=w*(-s*Math.cos(d*Math.PI/180)); W+=w; });
  if(W===0) return null; U/=W; V/=W;
  const s=Math.hypot(U,V); const d=(Math.atan2(-U,-V)*180/Math.PI+360)%360;
  return {u:U,v:V,s,d};
}
function setHour(t, keepView){
  const g=WM.grid; if(!g) return;
  WM.t=Math.max(0,Math.min(g.times.length-1,t));
  $("#wmrange").value=WM.t;
  const tm=g.times[WM.t], di=new Date(tm.slice(0,10)+"T12:00:00");
  $("#wmtime").textContent = di.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"numeric"})+" · "+tm.slice(11,13)+" h";
  buildField(); startAnim();
}
// ---- dibujo: fondo de colores + líneas animadas ----
function buildField(){
  const size=WM.map.getSize(), W=size.x, H=size.y, step=8;
  const cols=Math.ceil(W/step)+1, rows=Math.ceil(H/step)+1;
  const U=new Float32Array(cols*rows), V=new Float32Array(cols*rows), S=new Float32Array(cols*rows).fill(-1);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const ll=WM.map.containerPointToLatLng([c*step,r*step]); const w=sampleAt(ll.lat,ll.lng);
    if(w){ const k=r*cols+c; U[k]=w.u; V[k]=w.v; S[k]=w.s; }
  }
  WM.samp={U,V,S,cols,rows,step,W,H};
  const origin=WM.map.containerPointToLayerPoint([0,0]);
  [$("#wmbg"),$("#wmfx")].forEach(cv=>L.DomUtil.setPosition(cv,origin));
  const dpr=window.devicePixelRatio||1;
  [$("#wmbg"),$("#wmfx")].forEach(cv=>{ cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px"; cv.getContext("2d").setTransform(dpr,0,0,dpr,0,0); });
  const off=document.createElement("canvas"); off.width=cols; off.height=rows;
  const octx=off.getContext("2d"), img=octx.createImageData(cols,rows);
  for(let k=0;k<cols*rows;k++){ const s=S[k]; if(s<0) continue; const [R,G,B]=hex2rgb(windColorMap(s)); img.data[k*4]=R; img.data[k*4+1]=G; img.data[k*4+2]=B; img.data[k*4+3]=115; }
  octx.putImageData(img,0,0);
  const bg=$("#wmbg").getContext("2d"); bg.clearRect(0,0,W,H); bg.imageSmoothingEnabled=true; bg.drawImage(off,0,0,cols,rows,0,0,(cols)*step,(rows)*step);
  $("#wmbg").style.opacity=1; $("#wmfx").style.opacity=1;
  const n=Math.min(2200, Math.round(W*H/220));
  WM.parts=[...Array(n)].map(()=>newPart());
}
function windColorMap(kn){ // escala continua tipo mapa (azul → verde → amarillo → rojo → violeta)
  const s=[[0,"#5b6fd6"],[5,"#4f97e0"],[9,"#3fc1d6"],[13,"#3dcf8e"],[17,"#8bd43b"],[21,"#e2d634"],[25,"#f2a531"],[30,"#ec5f34"],[36,"#d23468"],[45,"#9b2fb3"]];
  if(kn<=s[0][0]) return s[0][1];
  for(let i=1;i<s.length;i++){ if(kn<=s[i][0]){ const [a,ca]=s[i-1],[b,cb]=s[i],f=(kn-a)/(b-a); const A=hex2rgb(ca),B=hex2rgb(cb); return "#"+A.map((x,j)=>Math.round(x+(B[j]-x)*f).toString(16).padStart(2,"0")).join(""); } }
  return s.at(-1)[1];
}
function hex2rgb(h){ return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); }
function newPart(){ const p=WM.samp; return {x:Math.random()*p.W, y:Math.random()*p.H, age:Math.floor(Math.random()*80)}; }
function fieldAt(x,y){ const p=WM.samp; const c=Math.round(x/p.step), r=Math.round(y/p.step); if(c<0||r<0||c>=p.cols||r>=p.rows) return null; const k=r*p.cols+c; if(p.S[k]<0) return null; return [p.U[k],p.V[k]]; }
function startAnim(){
  stopAnim(); if(!WM.samp) return;
  const ctx=$("#wmfx").getContext("2d"), {W,H}=WM.samp;
  ctx.clearRect(0,0,W,H);
  const k=0.07;
  const frame=()=>{
    ctx.globalCompositeOperation="destination-in"; ctx.fillStyle="rgba(0,0,0,0.9)"; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="source-over"; ctx.strokeStyle="rgba(255,255,255,0.85)"; ctx.lineWidth=1.2; ctx.beginPath();
    for(const p of WM.parts){
      const f=fieldAt(p.x,p.y);
      if(!f||p.age>90){ Object.assign(p,newPart(),{age:0}); continue; }
      const nx=p.x+f[0]*k, ny=p.y-f[1]*k;
      ctx.moveTo(p.x,p.y); ctx.lineTo(nx,ny); p.x=nx; p.y=ny; p.age++;
    }
    ctx.stroke();
    WM.anim=requestAnimationFrame(frame);
  };
  WM.anim=requestAnimationFrame(frame);
}
function stopAnim(){ if(WM.anim) cancelAnimationFrame(WM.anim); WM.anim=null; }

$("#maxw").onchange=e=>{state.maxW=+e.target.value;store.set("maxW",state.maxW);if(state.data)render();};
let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(state.data)render();},200);});
load();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
